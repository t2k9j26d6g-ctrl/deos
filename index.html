<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DEOS V5</title>
  <link rel="stylesheet" href="style.css?v=137" />
</head>

<body>
  <aside class="sidebar">
    <div class="brand">
      <div id="brandLogo" class="logo">D</div>
      <div>
        <strong id="brandAppName">DEOS</strong>
        <span id="brandSiteName">Saint-Gilles</span>
      </div>
    </div>
    <div id="brandVersion" class="version-chip" aria-label="Version de l'application"></div>
    <div id="brandEnvironment" class="environment-chip" hidden></div>

    <button class="nav active" data-view="cockpit">🏠 Cockpit</button>
    <button class="nav" data-view="graph">🕸️ Vue graphique</button>
    <button class="nav" data-view="folders">⭐ Dossiers</button>
    <button class="nav" data-view="projects">📁 Projets</button>
    <button class="nav" data-view="actions">✅ Actions</button>
    <button class="nav" data-view="decisions">📌 Décisions</button>
    <button class="nav" data-view="performance">📊 Performance</button>
    <button class="nav" data-view="priorities">🎯 Priorités</button>
    <button class="nav" data-view="managers">👥 Managers</button>
    <button class="nav" data-view="journal">📝 Journal opérationnel</button>
    <button class="nav" data-view="documents">📄 Documents</button>
    <button class="nav" data-view="links">🔗 Liens</button>
    <button class="nav nav-settings" data-view="settings">⚙️ Paramètres</button>
    <button class="nav" data-view="activity">🕘 Agenda / Réunions</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-date">
        <p id="today" class="today"></p>
      </div>
      <h1 id="viewTitle">Cockpit décisionnel</h1>
      <input id="searchInput" type="search" placeholder="Rechercher : chocolat, Ludovic, CSE..." />
    </header>

    <section id="app"></section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="libs/jszip.js?v=132"></script>
  <script src="libs/xlsx.full.min.js"></script>
  <script src="config.example.js?v=1"></script>
  <script src="supabase-client.js?v=1"></script>
  <script src="remote-adapter.js?v=1"></script>
  <script src="app.js?v=143"></script>
</body>
</html>
